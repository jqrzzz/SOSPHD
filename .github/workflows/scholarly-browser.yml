name: Scholarly browser acceptance (synthetic backend)
on:
  pull_request:
    paths:
      - 'app/docs/**'
      - 'components/doc-section-revision.tsx'
      - 'lib/doc-revision-actions.ts'
      - 'lib/docs/**'
      - 'lib/data/doc-revision-store.ts'
      - 'scripts/browser/**'
      - '.github/workflows/scholarly-browser.yml'
permissions:
  contents: read
concurrency:
  group: scholarly-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated browser-test tooling
        run: |
          python -m venv /tmp/sosphd-browser-venv
          /tmp/sosphd-browser-venv/bin/pip install playwright==1.55.0
          /tmp/sosphd-browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Verify actual UI and Server Actions with synthetic backend only
        run: /tmp/sosphd-browser-venv/bin/python scripts/browser/revision_acceptance.py
      - name: Upload synthetic acceptance summary and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scholarly-browser-synthetic
          path: test-results/revision-browser/
          if-no-files-found: error
          retention-days: 7
