name: Fieldwork acceptance (synthetic backend)
on:
  pull_request:
    paths:
      - 'app/fieldwork/**'
      - 'components/fieldwork/**'
      - 'lib/fieldwork/**'
      - 'lib/data/fieldwork-*.ts'
      - 'lib/fieldwork-actions.ts'
      - 'scripts/browser/fieldwork*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/fieldwork-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: fieldwork-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated browser tools
        run: |
          python -m venv /tmp/fieldwork-browser
          /tmp/fieldwork-browser/bin/pip install playwright==1.55.0
          /tmp/fieldwork-browser/bin/python -m playwright install --with-deps chromium
      - name: Exercise real page and actions with fictional local persistence
        run: /tmp/fieldwork-browser/bin/python scripts/browser/fieldwork_acceptance.py
      - name: Upload synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fieldwork-browser-synthetic
          path: |
            test-results/fieldwork-browser/summary.json
            test-results/fieldwork-browser/*.png
          if-no-files-found: error
          retention-days: 7
