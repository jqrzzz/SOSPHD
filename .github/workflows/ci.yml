name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # This repo ships pnpm-lock.yaml and no package-lock.json. CI previously
      # ran `npm install --legacy-peer-deps`, which ignored the committed
      # lockfile entirely and re-resolved the whole dependency tree on every
      # run — so CI was never testing the versions a developer has, `cache: npm`
      # had no lockfile to key on and cached nothing, and --legacy-peer-deps
      # silently swallowed a real peer conflict rather than surfacing it.
      #
      # pnpm + --frozen-lockfile fixes all three: identical tree everywhere,
      # a working cache, and the build fails loudly if the lockfile and
      # package.json ever disagree.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

  database-contract:
    name: Disposable database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Run isolated migration and role contracts
        run: pnpm run test:db

      - name: Upload sanitized database-contract summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-contract-summary
          path: test-results/db-contract-summary.json
          if-no-files-found: warn
          retention-days: 14
